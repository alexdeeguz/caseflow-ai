AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: CaseFlow OpenAI fact extraction with private queues, restricted credentials,
  and disabled consumption.
Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedPattern: '[a-z][a-z0-9-]{0,31}'
  DocumentBucketName:
    Type: String
    AllowedPattern: '[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]'
  EnableConsumer:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'false'
      - 'true'
  AlarmTopicArn:
    Type: String
    Default: ''
    AllowedPattern: ^$|arn:aws:sns:us-east-2:[0-9]{12}:[A-Za-z0-9_-]+
Rules:
  OhioOnly:
    Assertions:
      - Assert:
          Fn::Equals:
            - Ref: AWS::Region
            - us-east-2
        AssertDescription: Deploy only in the selected Ohio Region.
Conditions:
  ConsumeTasks:
    Fn::Equals:
      - Ref: EnableConsumer
      - 'true'
  HasAlarmTopic:
    Fn::Not:
      - Fn::Equals:
          - Ref: AlarmTopicArn
          - ''
Resources:
  FactDeadLetterQueue:
    Type: AWS::SQS::Queue
    Metadata:
      com.aws.cloudformation.Context:
        why: Retain failed deliveries for bounded operator recovery.
        must: Do not purge automatically.
    Properties:
      QueueName:
        Fn::Sub: ${AWS::StackName}-dlq
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
      RedriveAllowPolicy:
        redrivePermission: byQueue
        sourceQueueArns:
          - Fn::Sub: arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:${AWS::StackName}-tasks
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
  FactQueue:
    Type: AWS::SQS::Queue
    Metadata:
      com.aws.cloudformation.Context:
        why: Isolate model work from OCR traffic.
        must: One task reference per message; no document text.
    Properties:
      QueueName:
        Fn::Sub: ${AWS::StackName}-tasks
      VisibilityTimeout: 720
      MessageRetentionPeriod: 345600
      ReceiveMessageWaitTimeSeconds: 20
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn:
          Fn::GetAtt:
            - FactDeadLetterQueue
            - Arn
        maxReceiveCount: 5
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
  QueueTransportPolicy:
    Type: AWS::SQS::QueuePolicy
    Metadata:
      com.aws.cloudformation.Context:
        why: Require TLS for queue access with one resource per SQS policy statement.
        must: Keep the policy scoped to its attached queue.
    Properties:
      Queues:
        - Ref: FactQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: sqs:*
            Resource:
              Fn::GetAtt:
                - FactQueue
                - Arn
            Condition:
              Bool:
                aws:SecureTransport: 'false'
  DeadLetterQueueTransportPolicy:
    Type: AWS::SQS::QueuePolicy
    Metadata:
      com.aws.cloudformation.Context:
        why: Require TLS for queue access with one resource per SQS policy statement.
        must: Keep the policy scoped to its attached queue.
    Properties:
      Queues:
        - Ref: FactDeadLetterQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: sqs:*
            Resource:
              Fn::GetAtt:
                - FactDeadLetterQueue
                - Arn
            Condition:
              Bool:
                aws:SecureTransport: 'false'
  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    Metadata:
      com.aws.cloudformation.Context:
        why: Keep runtime credentials separate from API and OCR credentials.
        must: No secret values in templates, parameters, or outputs.
    Properties:
      Name:
        Fn::Sub: ${AWS::StackName}/database
      Description: Populate the required JSON value before enabling fact extraction.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
  OpenAISecret:
    Type: AWS::SecretsManager::Secret
    Metadata:
      com.aws.cloudformation.Context:
        why: Keep runtime credentials separate from API and OCR credentials.
        must: No secret values in templates, parameters, or outputs.
    Properties:
      Name:
        Fn::Sub: ${AWS::StackName}/openai
      Description: Populate the required JSON value before enabling fact extraction.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
  ExtractorLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: Bound log retention and enable safe operational metrics.
        must: Never log text, quotations, model responses, or credentials.
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${AWS::StackName}-extractor
      RetentionInDays: 30
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
  ExtractorRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: Read exact text versions and consume only the fact queue.
        must: No S3 writes, Textract, broad queue access, or direct database table
          grants.
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: FactRuntime
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource:
                  Fn::GetAtt:
                    - FactQueue
                    - Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  Fn::GetAtt:
                    - ExtractorLogGroup
                    - Arn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - Ref: DatabaseSecret
                  - Ref: OpenAISecret
              - Effect: Allow
                Action: s3:GetObjectVersion
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:s3:::${DocumentBucketName}/${Environment}/cases/*/documents/*/processed/*/*/text.json
  ExtractorFunction:
    Type: AWS::Serverless::Function
    Metadata:
      com.aws.cloudformation.Context:
        why: Process one durable chunk per invocation.
        must: Disabled until reviewed evaluation passes; use shared Lambda capacity.
      BuildMethod: makefile
    Properties:
      FunctionName:
        Fn::Sub: ${AWS::StackName}-extractor
      Runtime: python3.13
      Architectures:
        - x86_64
      CodeUri: ../../services/fact-extractor
      Handler: caseflow_facts.handlers.extraction.lambda_handler
      MemorySize: 1024
      EphemeralStorage:
        Size: 512
      Timeout: 120
      Role:
        Fn::GetAtt:
          - ExtractorRole
          - Arn
      Environment:
        Variables:
          FACT_EXTRACTOR_QUEUE_ARN:
            Fn::GetAtt:
              - FactQueue
              - Arn
          FACT_EXTRACTOR_STORAGE_BUCKET:
            Ref: DocumentBucketName
          FACT_EXTRACTOR_STORAGE_ENVIRONMENT:
            Ref: Environment
          FACT_EXTRACTOR_DATABASE_SECRET_ARN:
            Ref: DatabaseSecret
          FACT_EXTRACTOR_OPENAI_SECRET_ARN:
            Ref: OpenAISecret
      Events:
        Tasks:
          Type: SQS
          Properties:
            Queue:
              Fn::GetAtt:
                - FactQueue
                - Arn
            BatchSize: 1
            MaximumBatchingWindowInSeconds: 0
            FunctionResponseTypes:
              - ReportBatchItemFailures
            ScalingConfig:
              MaximumConcurrency: 5
            Enabled:
              Fn::If:
                - ConsumeTasks
                - true
                - false
    DependsOn: ExtractorLogGroup
  DeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Metadata:
      com.aws.cloudformation.Context:
        why: Alert on stuck or exhausted extraction work.
        must: Alert topic must have confirmed subscribers.
    Properties:
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value:
            Fn::GetAtt:
              - FactDeadLetterQueue
              - QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Ref: AlarmTopicArn
    Condition: HasAlarmTopic
  QueueAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Metadata:
      com.aws.cloudformation.Context:
        why: Alert on stuck or exhausted extraction work.
        must: Alert topic must have confirmed subscribers.
    Properties:
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value:
            Fn::GetAtt:
              - FactQueue
              - QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 900
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Ref: AlarmTopicArn
    Condition: HasAlarmTopic
  FunctionErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Metadata:
      com.aws.cloudformation.Context:
        why: Detect configuration and invocation failures.
        must: Do not include document identifiers in metric dimensions.
    Properties:
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value:
            Ref: ExtractorFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Ref: AlarmTopicArn
    Condition: HasAlarmTopic
  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Metadata:
      com.aws.cloudformation.Context:
        why: Show operational health without document contents.
        must: Only environment is a custom metric dimension.
    Properties:
      DashboardName:
        Fn::Sub: ${AWS::StackName}-facts
      DashboardBody:
        Fn::Sub: '{"widgets": [{"type": "metric", "width": 24, "height": 6, "properties":
          {"region": "us-east-2", "title": "Fact extraction work and allowance", "period":
          300, "stat": "Sum", "metrics": [["CaseFlow/FactExtraction", "CompletedChunks",
          "Environment", "${Environment}"], ["CaseFlow/FactExtraction", "FailedJobs",
          "Environment", "${Environment}"], ["CaseFlow/FactExtraction", "ProviderAttempts",
          "Environment", "${Environment}"], ["CaseFlow/FactExtraction", "Retries",
          "Environment", "${Environment}"], ["CaseFlow/FactExtraction", "AllowanceReservedNanodollars",
          "Environment", "${Environment}"]]}}, {"type": "metric", "width": 24, "height":
          6, "properties": {"region": "us-east-2", "title": "Provider latency", "period":
          300, "stat": "Average", "metrics": [["CaseFlow/FactExtraction", "ProviderLatencyMs",
          "Environment", "${Environment}"]]}}]}'
Outputs:
  QueueUrl:
    Description: API dispatcher destination.
    Value:
      Ref: FactQueue
  QueueArn:
    Description: Grant the API sender only SendMessage on this ARN.
    Value:
      Fn::GetAtt:
        - FactQueue
        - Arn
  DatabaseSecretArn:
    Description: Populate restricted extractor database JSON.
    Value:
      Ref: DatabaseSecret
  OpenAISecretArn:
    Description: Populate OpenAI API key JSON.
    Value:
      Ref: OpenAISecret
