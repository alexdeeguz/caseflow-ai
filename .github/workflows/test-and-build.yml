name: CaseFlow Test & Build
run-name: CaseFlow Test & Build Version ${{ vars.CASEFLOW_RELEASE_SERIES || '0.0' }}.${{ github.run_number }}

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'

defaults:
  run:
    shell: bash

jobs:
  unit:
    name: Unit Tests & Code Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: |
          npm install --global npm@11.12.1
          npm ci
      - name: Run API and web tests
        run: npm test
      - name: Run lint
        run: npm run lint
      - name: Run type checks
        run: npm run typecheck

  integration:
    name: PostgreSQL Integration Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPERATOR_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      SUPABASE_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: |
          npm install --global npm@11.12.1
          npm ci
      - name: Start PostgreSQL
        run: npm exec -- supabase db start
      - name: Apply database migrations
        run: npm run db:migrate
      - name: Configure the restricted database login
        run: npm run db:configure
      - name: Run PostgreSQL integration tests
        run: npm run test:integration

  build:
    name: Build & Package
    needs: [unit, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: |
          npm install --global npm@11.12.1
          npm ci
      - name: Build the API and web app
        run: |
          cp apps/web/.env.example apps/web/.env.production.local
          npm run build
      - name: Record build version
        id: version
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';

          const { version: packageVersion } = JSON.parse(readFileSync('package.json', 'utf8'));
          const commit = process.env.GITHUB_SHA;
          const runNumber = Number(process.env.GITHUB_RUN_NUMBER);
          const runAttempt = Number(process.env.GITHUB_RUN_ATTEMPT);
          const version = `${packageVersion}-ci.${runNumber}.${runAttempt}-g${commit.slice(0, 7)}`;
          const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
          const buildInfo = { version, packageVersion, commit, runNumber, runAttempt, runUrl };

          writeFileSync(
            join(process.env.RUNNER_TEMP, 'build-info.json'),
            `${JSON.stringify(buildInfo, null, 2)}\n`,
          );
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### Build version\n\n\`${version}\`\n`);
          NODE
      - name: Package the build
        id: package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          archive_path="$RUNNER_TEMP/caseflow-$BUILD_VERSION.tar.gz"
          tar -czf "$archive_path" \
            --exclude='apps/web/.next/cache' \
            --exclude='.env*' \
            --exclude='node_modules' \
            apps/api/dist packages/schemas/dist apps/web/.next \
            -C "$RUNNER_TEMP" build-info.json
          printf 'path=%s\n' "$archive_path" >> "$GITHUB_OUTPUT"
      - name: Upload the versioned build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.package.outputs.path }}
          archive: false
          if-no-files-found: error
          retention-days: 30
