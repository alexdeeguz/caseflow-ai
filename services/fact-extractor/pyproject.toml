[project]
name = "caseflow-fact-extractor"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "boto3==1.44.3",
    "psycopg[binary]==3.3.9",
    "pydantic==2.14.3",
    "openai==3.51.0",
]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/caseflow_facts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: requires an explicitly configured disposable local PostgreSQL server"]

[tool.ruff]
target-version = "py313"
line-length = 100
indent-width = 4

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]

[dependency-groups]
dev = [
    "boto3-stubs[s3,secretsmanager]==1.44.3",
    "mypy==2.4.1",
    "pip-audit==2.10.1",
    "pytest==9.2.0",
    "ruff==0.17.5",
]
